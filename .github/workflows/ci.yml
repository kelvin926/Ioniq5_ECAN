name: ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure platform-independent core
        run: cmake -S . -B build/core -DIONIQ5_ECAN_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/core --parallel
      - name: Test
        run: ctest --test-dir build/core --output-on-failure

  panda-safety-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out pinned opendbc and apply split-button patch
        run: |
          git clone --filter=blob:none https://github.com/commaai/opendbc.git /tmp/opendbc
          git -C /tmp/opendbc checkout b72c1fd55ae7e84763e40912bbe06b8f533cb66b
          git -C /tmp/opendbc apply --check "$GITHUB_WORKSPACE/patches/opendbc-hyundai-canfd-split-arm.patch"
          git -C /tmp/opendbc apply "$GITHUB_WORKSPACE/patches/opendbc-hyundai-canfd-split-arm.patch"
      - name: Build and test LDA split-arm safety hook
        working-directory: /tmp/opendbc
        run: |
          python -m pip install --disable-pip-version-check -e '.[testing]'
          python -m unittest \
            opendbc.safety.tests.test_hyundai_canfd.TestHyundaiCanfdSplitButtonArm

  ros1-noetic:
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential libusb-1.0-0-dev pkg-config \
            python3-nose python3-usb1 \
            ros-noetic-diagnostic-msgs \
            ros-noetic-message-generation \
            ros-noetic-roscpp \
            ros-noetic-std-srvs
      - name: Build ROS 1 catkin workspace
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          mkdir -p /tmp/ros_ws/src
          ln -s "$GITHUB_WORKSPACE" /tmp/ros_ws/src/ioniq5_ecan
          cd /tmp/ros_ws
          catkin_make -DCMAKE_BUILD_TYPE=Release
      - name: Run ROS 1 tests
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          cd /tmp/ros_ws
          catkin_make run_tests_ioniq5_ecan
          catkin_test_results --verbose
