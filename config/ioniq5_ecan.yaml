hardware:
  # Leave empty only when exactly one Panda is connected.
  panda_serial: ""
  # Hyundai CAN-FD nominal/data rates used by the pinned openpilot configuration.
  nominal_bitrate_kbps: 500
  data_bitrate_kbps: 2000
  usb_read_timeout_ms: 20
  usb_write_timeout_ms: 10
  # Hyundai K + Ioniq 5 HDA1: physical CAN1 -> logical ECAN 0.
  # camera_bus=2 is unused in this ECAN-only profile.
  ecan_bus: 0
  camera_bus: 2
  # Custom firmware keeps only ECAN enabled; harness_status must be 1.
  ecan_only: true
  # false: CRUISE_BUTTONS 0x1CF, true: CRUISE_BUTTONS_ALT 0x1AA.
  # Confirm from a passive fingerprint before actuation.
  alternate_buttons: false

topics:
  command: "/ioniq5/actuation_command"
  vehicle_state: "/ioniq5/vehicle_state"
  raw_can_rx: "/ioniq5/can_rx"
  raw_can_tx: "/ioniq5/can_tx"
  # Produces /ioniq5/can0/rx, /ioniq5/can1/rx, /ioniq5/can2/rx.
  raw_can_bus_prefix: "/ioniq5/can"

raw_can:
  publish_rx: true
  publish_bus_topics: true
  # Raw TX requires longitudinal permission; LFA also requires lateral permission.
  # Panda HYUNDAI_CANFD whitelist/content checks still apply.
  allow_tx: true

input:
  # ROS contract (user decision 2026-10-08): lateral = LFA StrTqReqVal torque request in
  # Panda counts (rounded, saturated at +/-1021), computed by the upstream controller;
  # acceleration = m/s^2. The host torque controller below is bypassed in direct_torque.
  # Options: steering_rate_deg_s, steering_rate_rad_s, curvature_1pm, direct_torque.
  lateral_mode: "direct_torque"
  # Do not clamp/slew the ROS steering-rate input. Values beyond the CAN representation
  # (torque and acceleration ranges below) saturate instead of stopping output.
  # Torque conversion, CAN quantization, engagement and watchdogs remain.
  unfiltered_input: true
  lateral_scale: 1.0
  lateral_offset: 0.0
  acceleration_scale: 1.0
  acceleration_offset: 0.0
  # false makes lateral + acceleration the only required command fields.
  # Set true later if the upstream controller owns an explicit deadman bit.
  use_enable_field: false

vehicle:
  wheelbase_m: 2.97
  steering_ratio: 14.26

lateral:
  # Carrotpilot Ioniq 5 torque-controller defaults. The steering-rate input is
  # integrated to a target angle and converted to desired lateral acceleration.
  steer_actuator_delay_s: 0.1
  torque_kp: 1.0
  torque_ki: 0.1
  torque_kd: 0.0
  torque_kf: 1.0
  lat_accel_factor: 3.172929
  friction: 0.096019
  friction_threshold: 0.3
  steering_angle_deadzone_deg: 0.0
  # The integral term may use the full torque range (3.78 x 270 = about 1021 counts) and
  # accumulates at every speed, including standstill. Saturation at max_torque still
  # stops accumulation (anti-windup).
  integral_output_limit: 3.78
  integrator_freeze_speed_mps: 0.0
  low_speed_factor_bp_mps: [0.0, 10.0, 20.0, 30.0]
  low_speed_factor_v: [15.0, 13.0, 10.0, 5.0]
  # Host target bounds apply only when input.unfiltered_input is false.
  max_target_angle_deg: 175.0
  max_target_rate_deg_s: 500.0
  # Torque-controller output 1.0 maps to torque_output_scale counts (Carrot tuning scale).
  torque_output_scale: 270
  # Command-path count limits at 100 Hz, not verified maximum MDPS motor torque.
  # Matches the local Panda patch: 1021 is the largest symmetric StrTqReqVal that
  # avoids DBC Reserved/Invalid raw codes (+1022/+1023), 2042 means no host slew,
  # and multiplier 0 means no host driver-torque limit.
  max_torque: 1021
  torque_rate_up: 2042
  torque_rate_down: 2042
  driver_torque_allowance: 250.0
  driver_torque_multiplier: 0.0
  driver_torque_factor: 1.0
  # Carrot-style EPS fault avoidance above 85 degrees: 89 request frames,
  # then two frames with only STEER_REQ cleared. Set angle to 0 to disable.
  steer_request_cutoff_angle_deg: 85.0
  steer_request_valid_frames: 89
  steer_request_cut_frames: 2

longitudinal:
  # Full 11-bit SCC aReqRaw/aReqValue encoding, matching the local Panda patch.
  # Commands outside this range saturate at the bound; output is not stopped.
  # Vehicle acceptance of this range is unverified.
  accel_min_mps2: -10.23
  accel_max_mps2: 10.24
  # SCC_CONTROL JerkUpperLimit/JerkLowerLimit metadata (CAN maximum 12.7) while enabled;
  # this does not slew the ROS acceleration command.
  jerk_limit_mps3: 12.7
  set_speed_kph: 30.0

safety:
  # Only publisher loss may preserve physical-button intent and resume while moving.
  # Requires the separately tested I5R1 Panda firmware extension.
  resume_on_command_return: true
  # Research-site profile: a fresh command may auto-arm after stationary/EPS/CAN
  # preflight and ECU quiet verification. Longitudinal also needs D and stock SCC.
  # LDA selects lateral-only; SET release selects lateral + longitudinal.
  allow_actuation: true
  allow_longitudinal: true
  auto_arm_on_command: true
  lateral_button_toggle: true
  longitudinal_button_toggle: true
  # The LDA steering channel ignores brake. Brake latches only longitudinal off until SET is
  # pressed again; releasing the brake alone never resumes acceleration.
  lateral_disengage_on_brake: false
  longitudinal_disengage_on_brake: true
  disengage_on_cancel: false
  longitudinal_override_on_gas: false
  # Zero disables these optional host-side limits. Panda firmware limits remain.
  max_active_speed_mps: 0.0
  max_abs_steering_angle_deg: 0.0
  command_timeout_ms: 250
  panda_timeout_ms: 500
  vehicle_state_timeout_ms: 250

  # Temporary active EPS pause: fixed 3-second return window (not a YAML parameter).
  # Hard-fault ECU restore retries are separate: 1..30 s backoff and explicit rearm.

runtime:
  control_rate_hz: 100
  health_rate_hz: 10
  # 0/-1 work without extra privileges. See docs/latency.md for RT setup.
  realtime_priority: 0
  control_cpu: -1
  receive_cpu: -1
